[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lupa-intranet"
version = "0.2.0"
description = "Lupa: intranet do gabinete (API, acesso, auditoria e agente); depende de lupa-pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "geoip2==5.3.0",
    "claude-agent-sdk==0.2.170",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "types-PyYAML==6.0.12.20241230",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "../../pipeline/src", "../../pipeline/tests/apoio"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/../../pipeline/src:$MYPY_CONFIG_FILE_DIR/../../pipeline/tests/apoio"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../pipeline/src", "../../pipeline/tests/apoio"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=lupa_intranet --cov-report=term-missing --cov-fail-under=90 -m 'not carga and not llm'"
markers = [
    "integracao: exige PostgreSQL e MinIO acessíveis",
    "carga: teste de carga lento (1 milhão de eventos); rode com `pytest -m carga --no-cov`",
    "injecao: regressão do saneamento contra o corpus de injeção (.sinteticos/injecao)",
    "agente: suíte de injeção do agente sobre autos ingeridos (Etapa 5.8)",
    "llm: smoke do cliente real do modelo; só com credencial (`pytest -m llm --no-cov`)",
]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:datetime.datetime.utcnow.. is deprecated:DeprecationWarning:botocore",
]
