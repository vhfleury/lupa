<form class="form-envio" hx-post="{{ acao_envio }}" hx-encoding="multipart/form-data" hx-target="next .resultado-envio">
  {% csrf_token %}
  <div class="campo">
    <label for="{{ id_envio }}">Arquivo PDF ou ZIP (até {{ limite_envio }})</label>
    <input id="{{ id_envio }}" name="arquivo" type="file" accept=".pdf,.zip,application/pdf,application/zip" required>
  </div>
  <div class="progresso" hidden>
    <label for="{{ id_envio }}-progresso">Enviando… <span class="percentual">0</span>%</label>
    <progress id="{{ id_envio }}-progresso" max="100" value="0">0%</progress>
  </div>
  <button type="submit">Enviar</button>
</form>
<div class="resultado-envio" aria-live="polite"></div>
