<div id="revisao-processo"{% if oob_revisao %} hx-swap-oob="true"{% endif %}>
{% if em_revisao %}
<div class="revisao" role="alert" data-testid="processo-em-revisao">
  <strong>Processo em revisão.</strong>
  Uma resposta do assistente foi bloqueada porque {{ motivo_revisao }}. O chat e os resumos gerados ficam suspensos até um desembargador liberar.
  {% if pode_liberar %}<a class="botao" href="/processos/{{ processo_id }}/chat/liberar">Liberar revisão</a>{% endif %}
</div>
{% endif %}
</div>
