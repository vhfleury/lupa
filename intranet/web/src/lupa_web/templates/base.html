{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Lupa{% endblock %}</title>
<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
<link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
<script src="{% static 'js/htmx.min.js' %}" defer></script>
<script src="{% static 'js/envio.js' %}" defer></script>
{% block cabeca %}{% endblock %}
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
{% if moldura %}
{% include "componentes/cabecalho.html" %}
<div class="corpo">
{% include "componentes/menu.html" %}
<main id="conteudo" tabindex="-1">
{% block conteudo %}{% endblock %}
</main>
</div>
{% else %}
<main id="conteudo" class="avulso{% if pagina_login %} pagina-login{% endif %}" tabindex="-1">
{% block avulso %}{% endblock %}
</main>
{% endif %}
</body>
</html>
