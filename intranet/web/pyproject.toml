[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lupa-web"
version = "0.2.0"
description = "Lupa: front da intranet em Django, renderizado no servidor; fala com a API por HTTP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.1",
    "httpx==0.28.1",
    "whitenoise==6.8.2",
    "segno==1.6.1",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-django==4.9.0",
    "respx==0.22.0",
    "django-stubs==5.2.0",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "lupa_web.configuracao"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "lupa_web.configuracao"
addopts = "--cov=lupa_web --cov-report=term-missing --cov-fail-under=90 -m 'not e2e'"
markers = [
    "integracao: exige a stack do compose (proxy e API) acessível",
    "e2e: fluxo no navegador com pytest-playwright, fora do ciclo",
]
