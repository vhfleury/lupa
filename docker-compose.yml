name: lupa

services:
  api:
    build:
      context: .
      dockerfile: intranet/api/Dockerfile
      args:
        INSTALAR_DEV: "true"
    env_file: .env
    environment:
      LUPA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LUPA_MINIO_ENDPOINT: minio:9000
      # Etapa 6.8: `falso` usa o modelo roteirizado (so desenvolvimento/teste; o E2E liga).
      LUPA_AGENTE_CLIENTE: ${LUPA_AGENTE_CLIENTE:-sdk}
    # Etapa 6: o acesso normal e pelo proxy (https://localhost:${PROXY_PORTA_HOST}/api). A porta
    # direta so continua para compatibilidade com scripts: com API_PORTA_HOST definida, publica
    # nela; sem a variavel, o Docker escolhe uma porta efemera, sempre so em 127.0.0.1.
    ports:
      - "127.0.0.1:${API_PORTA_HOST:-}:8000"
    # Atras do proxy: o IP real do cliente vem do X-Forwarded-For, aceito so da rede `borda`
    # (sub-rede fixa abaixo), para o rate limit por IP e a auditoria.
    command:
      - uvicorn
      - lupa_api.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${REDE_BORDA_SUBREDE:-172.31.240.0/24}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Processos sinteticos de referencia (4B.9), so leitura, para as medicoes da Etapa 4C.
    volumes:
      - ./.sinteticos:/app/.sinteticos:ro
    networks: [interna, borda]
    security_opt: ["no-new-privileges:true"]

  # Front (0.2, plano_front_django D1, D6): Django sob uvicorn, usuario nao root, so na rede
  # `borda`; chama a API em LUPA_WEB_API_URL. A imagem tambem roda os testes de lupa_web.
  front:
    build:
      context: .
      dockerfile: intranet/web/Dockerfile
      args:
        INSTALAR_DEV: "true"
    environment:
      LUPA_WEB_API_URL: http://api:8000
      LUPA_WEB_CHAVE_SECRETA: ${LUPA_WEB_CHAVE_SECRETA:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    networks: [borda]
    security_opt: ["no-new-privileges:true"]

  # Proxy reverso (Etapa 6; 0.2 D2): tudo vai ao front; a API nao e alcancavel pelo proxy. HTTPS
  # com certificado autoassinado do proprio Caddy (`tls internal`). CA em tmpfs: um certificado
  # novo a cada subida, aceitavel no piloto local.
  proxy:
    image: caddy:2.8.4-alpine
    user: "10001:10001"
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    volumes:
      # A pasta inteira: Caddyfile e modos/interno.caddy (certificado da CA interna do Caddy).
      - ./intranet/proxy:/etc/caddy:ro
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${PROXY_PORTA_HOST:-8443}:8443"
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/saude"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [borda, cliente]
    security_opt: ["no-new-privileges:true"]

  # Testes ponta a ponta (Playwright) contra a stack real, pelo proxy. So sobe sob demanda:
  # `docker compose run --rm e2e` (ver docs/sistema/front.md e intranet/web/scripts/e2e.sh).
  e2e:
    build:
      context: ./intranet/web/e2e
    profiles: [e2e]
    environment:
      LUPA_E2E_URL: https://proxy:8443
      LUPA_E2E_DES_USUARIO: ${LUPA_E2E_DES_USUARIO:-}
      LUPA_E2E_DES_SENHA: ${LUPA_E2E_DES_SENHA:-}
      LUPA_E2E_PROC_USUARIO: ${LUPA_E2E_PROC_USUARIO:-}
      LUPA_E2E_PROC_SENHA: ${LUPA_E2E_PROC_SENHA:-}
      LUPA_E2E_PROC_ID: ${LUPA_E2E_PROC_ID:-}
      LUPA_E2E_CHAT_PROCESSO: ${LUPA_E2E_CHAT_PROCESSO:-}
      LUPA_E2E_HOSTIL_PROCESSO: ${LUPA_E2E_HOSTIL_PROCESSO:-}
    shm_size: 1gb
    depends_on:
      proxy:
        condition: service_healthy
    networks: [cliente]
    security_opt: ["no-new-privileges:true"]

  # Worker da ingestao (Etapa 4A): so na rede interna `ingestao`, sem saida para fora e sem porta
  # publicada. Os parsers rodam em subprocesso com limites e sem variaveis LUPA_* (sandbox.py).
  # Versao 0.2 (D21): a imagem do worker tambem roda a suite da pipeline (dependencias de dev).
  worker:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
      args:
        INSTALAR_DEV: "true"
    command: ["python", "-m", "lupa_pipeline.ingestao.worker"]
    env_file: .env
    environment:
      LUPA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LUPA_MINIO_ENDPOINT: minio:9000
    # Processos sinteticos de referencia (4B.9), so leitura, para a regressao de injecao.
    volumes:
      - ./.sinteticos:/app/.sinteticos:ro
    healthcheck:
      test: ["CMD", "python", "-m", "lupa_pipeline.ingestao.worker", "--saude"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [ingestao]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:16-alpine
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna, ingestao]

  # Imagem do object storage em variavel (Etapa 7.1, docs/decisoes/object-storage.md); o padrao e
  # o pgsty/minio por digest (precisa do `mc` para healthcheck e minio-init).
  minio:
    image: ${STORAGE_IMAGEM:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    user: "10002:10002"
    command: server /var/tmp/dados --console-address ":9001"
    environment:
      HOME: /tmp
      MINIO_ROOT_USER: ${LUPA_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LUPA_MINIO_SECRET_KEY}
    volumes:
      - minio-dados:/var/tmp
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORTA_HOST:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna, ingestao]

  minio-init:
    image: ${STORAGE_IMAGEM:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    depends_on:
      minio:
        condition: service_healthy
    user: "10002:10002"
    environment:
      HOME: /tmp
      MINIO_ACCESS_KEY: ${LUPA_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${LUPA_MINIO_SECRET_KEY}
      BUCKET: ${LUPA_MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set lupa http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" && mc mb --ignore-existing "lupa/$$BUCKET"
    networks: [interna]

networks:
  interna:
    driver: bridge
  ingestao:
    driver: bridge
    internal: true
  # Etapa 6: proxy <-> api/front. Sub-rede fixa para a API confiar no X-Forwarded-For so daqui.
  borda:
    driver: bridge
    ipam:
      config:
        - subnet: ${REDE_BORDA_SUBREDE:-172.31.240.0/24}
  # Etapa 6: clientes internos do proxy (o conteiner de E2E); nao alcanca api nem banco.
  cliente:
    driver: bridge

volumes:
  db-dados:
  minio-dados:
