# Configuração do Alembic. A URL do banco vem de LUPA_DATABASE_URL (lupa.config), nunca daqui.
# Uso (dentro do contêiner): alembic -c pipeline/src/lupa_pipeline/migrations/alembic.ini upgrade head
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
file_template = v%%(rev)s_%%(slug)s
